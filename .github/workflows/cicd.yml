name: Mi primer CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  compilacioncita:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Configurar JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Compilar el proyecto
        run: mvn clean package -DskipTests
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOMBRE_USR: ${{ secrets.NOMBRE_USR }}
      - name: Ejecutar el proyecto
        run: |
          java -jar target/ejemplo02-0.0.1-SNAPSHOT.jar &
          echo $! > springboot.pid
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOMBRE_USR: ${{ secrets.NOMBRE_USR }}
      - name: Esperar y probar un endpoint
        run: |
          sleep 30
          curl http://localhost:8080/actuator/health
      - name: Detener la aplicación
        run: kill -9 $(cat springboot.pid)