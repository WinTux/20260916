name: CI/CD Pipeline con Matrix Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  compilacion-pruebas:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [25, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Configurar JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '${{ matrix.java }}'
      - name: Cache de paquetes Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      - name: Compilar el proyecto
        run: mvn clean package -DskipTests
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOMBRE_USR: ${{ secrets.NOMBRE_USR }}
      - name: Ejecutar el proyecto
        shell: bash
        run: |
          java -jar target/ejemplo02-0.0.1-SNAPSHOT.jar &
          echo $! > springboot.pid
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOMBRE_USR: ${{ secrets.NOMBRE_USR }}
      - name: Esperar y probar un endpoint
        shell: bash
        run: |
          sleep 30
          curl http://localhost:8080/actuator/health
      - name: Ejecutando tests con Maven
        shell: bash
        run: mvn clean verify
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOMBRE_USR: ${{ secrets.NOMBRE_USR }}
      - name: Detener la aplicación
        shell: bash
        run: kill -9 $(cat springboot.pid)
  deploy:
    needs: compilacion-pruebas
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Configurar JDK 26
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '26'
      - name: Cache de paquetes Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ubuntu-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ubuntu-maven-
      - name: Compilar el proyecto
        run: mvn clean package -DskipTests
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOMBRE_USR: ${{ secrets.NOMBRE_USR }}
